name: CI

# The checks every push has to pass: types, lint, tests, and a production build.
#
# WHY THIS EXISTS. Every push to `main` deploys (Cloudflare Pages), and until Oct 8, 2026 nothing ran
# the 2,500-odd tests or even the type-check before that happened: they protected the site only if
# whoever pushed remembered to run them. The first run of this job found a hook that React would
# throw on and two test assertions that could never fail.
#
# NO SECRETS, ON PURPOSE. The tests run against placeholder Supabase settings (`test.env` in
# vite.config.js) and the build needs none, so this job can run on any branch and any pull request
# without holding a key. A test that needs data mocks the client.
#
# IT IS THE GATE. `main` takes changes only through a pull request whose `check` and `layout` jobs
# passed (the ruleset in .github/rulesets/), and Cloudflare deploys what lands there. Renaming a job
# renames the check the ruleset requires, so change both together or every pull request waits forever.
#
# Pull requests, and `main` itself: the scheduled jobs that commit generated files straight to
# `main` (allowed by the ruleset) still get checked after the fact. A branch with no pull request
# runs nothing, which is what keeps one change from running twice.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # THE CODE THE APP BUILD NEVER SEES. Everything below deploys or runs somewhere other than the
      # site, and each one used to fail only there: a Pages Function at Cloudflare's upload (which
      # leaves the old deploy serving), a cron script at its next scheduled run, an edge function at
      # `supabase functions deploy`. None needs a key, and the three take about 15 seconds together.

      # tsc already reads functions/, but not what a bundler does with it: a function that imports
      # a module pulling in a Vite asset type-checks fine and fails Cloudflare's bundle.
      - name: Pages Functions bundle
        run: npm run check-functions

      # Lint and tsc both skip scripts/. Node's syntax check for the .mjs jobs, a bundle for the
      # .ts ones (the same esbuild call their npm scripts make, so a bad import fails here).
      - name: Cron scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done
          npx esbuild "scripts/*.ts" --bundle --platform=node --format=esm --packages=external --outdir=node_modules/.cache/scripts-check --log-level=warning

      # wpbl-ingest loads the recap engine from src/ under Deno, which resolves imports literally:
      # an import missing its `.ts`, or one reaching constants.ts and its logo assets, fails only at
      # deploy, and nothing else here runs Deno. This resolves each function's whole module graph.
      # It is not `deno check`: the supabase-js types disagree with the ingest's row shapes in ten
      # places Deno's strict mode reports, and that is a separate piece of work.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Edge functions resolve
        run: deno cache --no-config --no-lock supabase/functions/*/index.ts

      # DEAD CODE: unused files, exports and dependencies across src/, functions/, scripts/ and the
      # edge functions (knip.jsonc). REPORTED, NEVER BLOCKING, on purpose: an export a change has
      # just orphaned is the next change's to delete, not a reason to hold this one. Last, so it adds
      # nothing to the path to the checks that do block. See docs/CI.md.
      - name: Dead code
        continue-on-error: true
        run: npm run knip

  # WHETHER A PULL REQUEST CAN CHANGE A LAYOUT. The sweep is most of the wait on every pull request,
  # and one that edits only docs, cron scripts, other workflows or the database cannot move a box
  # on a page. Everything not listed as safe counts as UI, so a new folder is swept until someone
  # decides otherwise; the sweep itself, its fixtures and this file are always swept. Read from the
  # API rather than a deep clone, and a renamed file counts under both names, so moving a page
  # into docs/ is still a change to src/. A push to `main` always sweeps.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sweep: ${{ steps.files.outputs.sweep }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo sweep=true >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          cat files.txt
          # An empty list (an API hiccup, or a pull request with no diff) sweeps rather than guesses.
          sweep=$([ -s files.txt ] && echo false || echo true)
          while read -r f; do
            case "$f" in
              scripts/layout-sweep.mjs | scripts/fixtures/* | .github/workflows/ci.yml) sweep=true ;;
              docs/* | *.md | scripts/* | .github/* | supabase/*) ;;
              *) sweep=true ;;
            esac
          done < files.txt
          echo "sweep=$sweep" | tee -a "$GITHUB_OUTPUT"

  # The layout checks CLAUDE.md used to ask a person to do: overflow at four widths and both text
  # sizes, and what moves on screen when a skeleton is replaced (default text only). Against the dev server, because
  # the skeleton check needs ?devSlow, which only exists in a dev build; with every response served
  # from scripts/fixtures/, because this job holds no key and must not read the real database.
  #
  # EIGHT SLICES IN PARALLEL, by route (--shard). On one runner this was the slowest check on every
  # pull request, about 13 minutes against 4 for `check`. Four slices still took about 9 minutes
  # each (Oct 14, 2026), nearly all of it the sweep's fixed waits, which stay as they are because
  # they are what catch loading phases on this slower runner (docs/CI.md). Setup is about 25
  # seconds a slice, so halving the routes per slice nearly halves the wall clock.
  #
  # The experiments sweep is its own slice rather than a second step in the first. As a step it ran
  # after shard 1's own sweep, already the longest of the slices, and added its 35 seconds to the
  # slowest path through every pull request; alone it finishes well before any of them.
  #
  # SKIPPED STEP BY STEP, NOT AS A JOB, when `changes` says the pull request touches no UI. A
  # skipped job reports `skipped`, which fails the `layout` test below; a job whose steps all skip
  # reports success, so `layout` still goes green and the pull request still merges.
  layout-shard:
    name: layout ${{ matrix.shard }}${{ matrix.shard != 'experiments' && '/8' || '' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, experiments]
    env:
      SWEEP: ${{ needs.changes.outputs.sweep }}
      VITE_SUPABASE_URL: 'http://127.0.0.1:54321'
      VITE_SUPABASE_ANON_KEY: 'sweep-anon-key'
      VITE_VAPID_PUBLIC_KEY: 'sweep-vapid-key'
    steps:
      - if: ${{ env.SWEEP != 'true' }}
        run: echo "No UI change in this pull request, so no sweep (the changes job lists why)."

      - if: ${{ env.SWEEP == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ env.SWEEP == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - if: ${{ env.SWEEP == 'true' }}
        run: npm ci

      - name: Start the dev server
        if: ${{ env.SWEEP == 'true' }}
        run: |
          nohup npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 1; done
          cat vite.log; exit 1

      - name: Sweep
        if: ${{ env.SWEEP == 'true' && matrix.shard != 'experiments' }}
        run: npm run sweep -- --replay --shift --baseline --shots sweep-shots --shard ${{ matrix.shard }}/8

      # The one place a flag-gated layout gets looked at. Name the routes that draw something
      # behind the flag; as of this writing that is the steal card on Run value, and nothing else.
      - name: Sweep with experiments on
        if: ${{ env.SWEEP == 'true' && matrix.shard == 'experiments' }}
        run: npm run sweep -- --replay --shift --baseline --shots sweep-shots --experiments --routes /wpbl/stats?board=runs

      # Both frames of every case that shifted. A shift that hangs on timing can happen on this
      # runner and on no desktop (the awards results did, Oct 2026), and the log line alone could
      # not tell a real jump from the sweep misreading one.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-shots-${{ matrix.shard }}
          path: sweep-shots
          if-no-files-found: ignore

      - if: failure()
        run: cat vite.log

  # THE CHECK THE RULESET REQUIRES. It names `layout`, and a matrix job reports one check per
  # slice under a different name, so this job carries the name and passes only if every slice did.
  # `always()` because a job whose needs failed is otherwise SKIPPED, and a skipped required check
  # counts as passing.
  layout:
    needs: layout-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.layout-shard.result }}" = success
