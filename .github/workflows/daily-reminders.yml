name: Daily Pick Reminders

on:
  schedule:
    # 4:00 PM UTC = 12:00 PM ET — after the day's schedule is set, before most
    # first pitches. Adjust to taste; day games (~1 PM ET) get the shortest heads-up.
    - cron: '0 16 * * *'
  workflow_dispatch:   # also triggerable manually from the GitHub Actions UI
    inputs:
      test_user:
        description: 'Optional: send a one-off TEST push to this user (id or email), bypassing pick checks. Leave blank for a normal reminder run.'
        required: false
        default: ''

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the three packages the sender imports — see the note in
      # game-start-reminders.yml.
      - name: Install sender dependencies
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            $(node -p "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};['@supabase/supabase-js','web-push','ws'].map(k=>k+'@'+d[k]).join(' ')")

      - name: Send pick reminders
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY:          ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:         ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:             ${{ secrets.VAPID_SUBJECT }}
          TEST_USER:                 ${{ inputs.test_user }}
        run: |
          if [ -n "$TEST_USER" ]; then
            node scripts/send-reminders.mjs --test "$TEST_USER"
          else
            node scripts/send-reminders.mjs
          fi
