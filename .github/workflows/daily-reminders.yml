name: Daily Pick Reminders

on:
  schedule:
    # 4:00 PM UTC = 12:00 PM ET — after the day's schedule is set, before most
    # first pitches. Adjust to taste; day games (~1 PM ET) get the shortest heads-up.
    - cron: '0 16 * * *'
  workflow_dispatch:   # also triggerable manually from the GitHub Actions UI
    inputs:
      test_user:
        description: 'Optional: send a one-off TEST push to this user (id or email), bypassing pick checks. Leave blank for a normal reminder run.'
        required: false
        default: ''

# One reminder sender at a time. This job sends push notifications, so an overlap is not a
# wasted run, it is a duplicate notification on someone's phone. A manual test dispatch landing
# on top of the scheduled run is the likely way that happens.
concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Nothing to do outside the MLB calendar's 'games' window: see scripts/mlb-job-due.mjs.
      # Before any install, so a skipped day costs one request. A manual run always goes through.
      - name: Check the MLB calendar
        id: due
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/mlb-job-due.mjs games

      # Only the three packages the sender imports — see the note in
      # game-start-reminders.yml.
      - name: Install sender dependencies
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        uses: ./.github/actions/script-deps
        with:
          packages: '@supabase/supabase-js web-push ws'

      - name: Send pick reminders
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY:          ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:         ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:             ${{ secrets.VAPID_SUBJECT }}
          TEST_USER:                 ${{ inputs.test_user }}
        run: |
          if [ -n "$TEST_USER" ]; then
            node scripts/send-reminders.mjs --test "$TEST_USER"
          else
            node scripts/send-reminders.mjs
          fi
