name: WPBL Play-by-Play Validation

# Checks the league's play-by-play against the rules of baseball, and records the result.
#
# The league's scoring has errors and they are not reachable to fix it at source, so we find
# them ourselves. Running nightly rather than on demand is the point: a mis-scored game is far
# cheaper to check while the video is fresh and someone still remembers the inning.
#
# THIS JOB DOES NOT FAIL ON FINDINGS, on purpose. The validator reports everything it can see
# and most of it is already known and not going anywhere, so failing on findings would mean a
# red X every single night and a job nobody reads inside a week. It writes a row to
# wpbl_pbp_validation_runs and exits 0. The admin panel at /admin shows the state, next to the
# feed mirror's own freshness, and the thing worth watching there is whether the run is recent:
# a gap means the job stopped, which is the only failure that actually needs attention.
#
# Triaging a finding means either correcting it (wpbl_play_corrections) or accepting it:
#   node --env-file=.env scripts/validate-wpbl-pbp.mjs \
#     --baseline scripts/wpbl-pbp-baseline.json --update-baseline
# then commit the baseline. Anything not in it counts as new and shows in the panel.

on:
  schedule:
    # 08:00 UTC is the small hours Central: every game of the previous day has long since gone
    # final and been ingested, and nothing is mid-flight.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: wpbl-pbp-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only `pg` is needed. `npm ci` would pull the whole frontend toolchain this script never
      # imports; the version is read from package.json so there is still one source of truth.
      # Same approach as the reminder workflows.
      - name: Install validator dependency
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            $(node -p "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};['pg'].map(k=>k+'@'+d[k]).join(' ')")

      - name: Validate play-by-play
        env:
          # The same direct Postgres connection string the migration runner uses. The checks are
          # window functions and full-table joins across four tables, which is SQL's job rather
          # than something to reimplement over PostgREST.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # --record writes the run row and always exits 0, including when the run itself throws,
        # so a broken job still reports rather than leaving the panel showing the last good run.
        run: node scripts/validate-wpbl-pbp.mjs --baseline scripts/wpbl-pbp-baseline.json --record
