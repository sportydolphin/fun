name: Daily Bot Predictions

on:
  schedule:
    # 2:00 PM UTC = 10:00 AM ET — comfortably before the earliest day games
    - cron: '0 14 * * *'
    # Back-up attempt 90 min later. GitHub-hosted runners are best-effort and a
    # scheduled run is sometimes dropped or cancelled at provisioning (never runs a
    # step). The bots are idempotent (ignoreDuplicates), so a second run is a safe
    # retry, and 11:30 AM ET is still before most day games.
    - cron: '30 15 * * *'
  workflow_dispatch:   # also triggerable manually from GitHub Actions UI

jobs:
  run-bots:
    runs-on: ubuntu-latest
    # Normal run is ~35s; cap it so a stalled fetch (StatsAPI/Supabase) fails fast
    # instead of hanging. Queue/provisioning time is not counted toward this.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update team payrolls
        run: node scripts/update-payrolls.mjs
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run prediction bots
        run: node scripts/run-bots.mjs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Same slot on purpose: survivor bots must pick before first pitch, just like
      # the prediction bots. The nightly resolver grades their picks overnight.
      - name: Run Streak Survivor bots
        run: node scripts/run-survivor-bots.mjs
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Streak leaders moved to .github/workflows/update-streaks.yml — this slot
      # runs before first pitch, which is exactly when the boards are staleest.
