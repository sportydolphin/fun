name: WPBL Bluesky Recaps

# Posts a finished WPBL game to Bluesky: the recap as text, the box score as an image.
#
# THIS IS THE ONE JOB IN THE REPO THAT PUBLISHES TO A THIRD-PARTY PLATFORM. It posts to our own
# timeline and nowhere else. The mention watcher's rule is untouched by it and still stands:
# that job finds threads and never replies to them, and nothing here may ever reply, quote or
# mention anybody.
#
# THERE IS NO EDIT ON BLUESKY, which is the whole reason this is not the Discord job with a
# different URL. Discord's recap is re-rendered every run and PATCHed when the numbers change,
# so a late scoring correction fixes itself in place. Here a post is published or deleted, in
# public, with nothing in between. So a game is not posted the moment it goes final: the job
# records when it FIRST saw the game final and publishes on a later run, once it has settled
# long enough for corrections to land. wpbl_play_corrections exists because the league's
# scoring has errors in it.
#
# IT NEVER BACKFILLS. The first run against an empty table records every existing final as
# handled and posts nothing, so switching this on does not put a season on the timeline.
#
# EVERY 15 MINUTES because the settle window does the waiting, not the schedule. A run with
# nothing due is two queries and exits.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the post and the card to the log, publish nothing'
        type: boolean
        default: false
      seed:
        description: 'Record every existing final as handled without posting any of them'
        type: boolean
        default: false

concurrency:
  # Never two at once. Both would read the same unposted game and both would publish it, and a
  # duplicate cannot be edited away afterwards.
  group: wpbl-bluesky-recaps
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Unlike the sibling cron jobs this one cannot install a hand-picked subset: it bundles
      # TypeScript out of src/ with esbuild and rasterises a card, so it needs the real tree.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Post recaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # wpbl_bluesky_recap_posts is RLS'd with no policies. Any other key reads it as empty,
          # which this job would take to mean nothing has been posted, and would republish the
          # lot with no way to edit them away.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The same account as the mention watcher: sportydolphin is the brand, not a person.
          # An App Password, never the account password.
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npm run bluesky-recaps -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.seed && '--seed' || '' }}
