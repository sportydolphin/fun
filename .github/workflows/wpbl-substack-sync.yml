name: WPBL Substack Sync

# SCHEDULE DISABLED. This job cannot run from GitHub Actions.
#
# Substack serves Cloudflare's JavaScript interstitial ("Just a moment...") to datacenter
# address space, and it covers the whole host: both /api/v1/archive AND /feed answer 403
# from a runner while the identical requests return 200 from a laptop. It is a generic edge
# defence, not anything aimed at us or at her. Verified twice by workflow_dispatch, once
# after switching to a browser User-Agent and full browser headers, which changed nothing:
# the challenge wants a client that executes JavaScript, and defeating that deliberately is
# bot-detection evasion rather than a fix.
#
# Every scheduled run failed, 7 for 7, so the cron is off rather than left to fail hourly
# and train everyone to ignore this workflow's red X. Manual dispatch stays, because it is
# how the block gets re-tested cheaply: if Substack ever relaxes the rule, one dry-run says
# so immediately.
#
# The data already in wpbl_articles is unaffected and the site reads it normally. What
# stopped is the automatic pickup of NEW posts. See docs/READING.md for the options; the
# short version is that this needs to run from a residential IP.
#
#  schedule:
#    - cron: '0 12-23 * * *'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'How to run. "dry-run" prints what it would write and writes nothing. "sync" is the normal run.'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, sync]

# One writer at a time; skip a tick rather than racing two upserts of the same rows.
concurrency:
  group: wpbl-substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same trick as the sibling WPBL workflows: install only what this script needs, at
      # the versions pinned in package.json. esbuild is among them because the script is
      # TypeScript, which is what lets the matching rules live in a unit-tested module
      # (src/wpbl/derive/articles.ts) rather than inside the job.
      - name: Install dependencies
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            $(node -p "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};['@supabase/supabase-js','ws','esbuild'].map(k=>k+'@'+d[k]).join(' ')")

      - name: Sync the WPBL reading feed
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE:                      ${{ inputs.mode }}
        run: |
          case "$MODE" in
            dry-run)  npm run substack-sync -- --dry-run ;;
            *)        npm run substack-sync ;;
          esac
