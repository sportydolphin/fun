name: R2 Storage Watch

on:
  schedule:
    # Daily. R2 samples storage a few times a day and bills by the month, so a faster check
    # would see the same number; daily is enough to warn days before a free allowance runs out.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = read, record and alert. dry-run = read and print only.'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, normal]

concurrency:
  group: r2-storage-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        uses: ./.github/actions/script-deps
        with:
          packages: 'pg web-push'

      - name: Read R2 usage
        env:
          # Account Analytics Read only: this job reads usage and can change nothing in Cloudflare.
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          SUPABASE_DB_URL:            ${{ secrets.SUPABASE_DB_URL }}
          VAPID_PUBLIC_KEY:           ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:          ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:              ${{ secrets.VAPID_SUBJECT }}
          MODE:                       ${{ inputs.mode }}
        # A scheduled run has no `inputs`, so MODE is empty and falls through to the real run.
        run: |
          if [ "$MODE" = "dry-run" ]; then
            node scripts/watch-r2-storage.mjs --dry-run
          else
            node scripts/watch-r2-storage.mjs
          fi
