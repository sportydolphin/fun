name: WPBL Discord Board

on:
  schedule:
    # Every 15 minutes during WPBL waking hours (Central-time hub — see the reminder
    # workflow for the same reasoning). The board only needs refreshing often enough
    # that the live countdown and "in progress" flip stay roughly current; the actual
    # <t:...> timestamps count down on their own between runs, so this cadence is plenty.
    # Season window, matching the MLB workflows' `3-10`. The 2026 feed runs Aug 1 to Sep 22
    # (regular season ends Sep 6; the postseason runs Sep 9 to Sep 22) and
    # then goes quiet until spring, so without this the job runs every day of the winter with
    # no game to act on. The window is deliberately WIDER than the season we know about: 2026
    # was the inaugural year and a 2027 schedule could start much earlier, and a window that
    # clips a real season fails silently, which is far worse than a few idle runs in March.
    # `workflow_dispatch` still covers an out-of-season run.
    #
    # The night half runs to 06:59 UTC (1:59am Central) and the extra three hours are NOT
    # slack, they are the whole correctness margin. A 6:30pm Central game goes final around
    # 02:15 UTC, and the board only drops it once a run sees `status = final`, so every
    # corrective tick has to land AFTER that. GitHub drops most `*/15` ticks on this repo
    # (measured median gap 38 minutes against a declared 15), so an 03:59 UTC close left
    # one usable hour and some nights nothing landed in it: the board sat on a finished
    # game marked "live now" until 14:00 UTC, ~13 hours, with every workflow run green.
    # That is the failure this width buys off. Do not trim it back toward the last first
    # pitch: the window has to outlast the last FINAL, plus however many ticks GitHub eats.
    - cron: '*/15 14-23,0-6 * 3-10 *'
  workflow_dispatch:   # run on demand from the Actions tab (use this for the first, creating run)

# One board writer at a time; skip a tick rather than racing two edits.
concurrency:
  group: wpbl-discord-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same trick as the reminder workflow: install only the two packages this script
      # imports, at the versions pinned in package.json, instead of the whole frontend.
      - name: Install dependencies
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            $(node -p "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};['@supabase/supabase-js','ws'].map(k=>k+'@'+d[k]).join(' ')")

      - name: Update WPBL Discord board
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOARD_WEBHOOK_URL:  ${{ secrets.DISCORD_BOARD_WEBHOOK_URL }}
          DISCORD_BOARD_MESSAGE_ID:   ${{ vars.DISCORD_BOARD_MESSAGE_ID }}
          DISCORD_WATCH_PARTY_VC_URL: ${{ vars.DISCORD_WATCH_PARTY_VC_URL }}
          DISCORD_EVENTS_URL:         ${{ vars.DISCORD_EVENTS_URL }}
        run: node scripts/update-wpbl-discord-board.mjs
