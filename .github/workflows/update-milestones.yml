name: Update Milestone Watch

# Nightly precompute of active players closing in on career, season, and all-time
# milestones → the milestone_watch table (one jsonb row per season). Third
# consumer of the streak-precompute template; the client reads one row.
#
# Once a day is plenty: career and season totals move by at most a game's worth
# between runs. The 07:00 UTC slot sits after the streak-board and survivor jobs
# so the nightly StatsAPI load is spread out rather than stacked.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:   # also triggerable manually from the GitHub Actions UI

# Never let two runs upsert the same season row at once.
concurrency:
  group: update-milestones
  cancel-in-progress: false

jobs:
  update-milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # update-milestones.mjs imports exactly two packages — no need for `npm ci`
      # and the whole frontend toolchain.
      - name: Install script dependencies
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            $(node -p "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};['@supabase/supabase-js','ws'].map(k=>k+'@'+d[k]).join(' ')")

      - name: Update milestone watch
        run: node scripts/update-milestones.mjs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
