name: Photo Submissions Notify

on:
  # The database wakes this (public.wpbl_photo_submission_nudge on every submission and decision,
  # public.wpbl_photo_submission_sweep every ten minutes while anyone is still owed a notice). No
  # GitHub schedule: with nothing waiting there is nothing to do, and the sweep is the backstop.
  # See scripts/migrations/20261113200000_photo_submission_notifications.sql.
  repository_dispatch:
    types: [photo-submissions]
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = send and mark. dry-run = print who would hear what.'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, normal]

# Two wakes close together must not both read the same unmarked rows and push twice.
concurrency:
  group: photo-submissions-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        uses: ./.github/actions/script-deps
        with:
          packages: 'pg web-push'

      - name: Notify the owner and fans
        env:
          SUPABASE_DB_URL:   ${{ secrets.SUPABASE_DB_URL }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          MODE:              ${{ inputs.mode }}
        # A dispatched run has no `inputs`, so MODE is empty and falls through to the real run.
        run: |
          if [ "$MODE" = "dry-run" ]; then
            node scripts/notify-photo-submissions.mjs --dry-run
          else
            node scripts/notify-photo-submissions.mjs
          fi
